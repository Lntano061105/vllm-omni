# High-impact Token2Wav solver ablation pinned to physical NPU 5.
#
# RK4 with one integration interval evaluates the DiT estimator four times.
# Euler evaluates it once.  This candidate is performance-only until it passes
# the official TTS-Seed / Demo audio-quality admission gates.
base_config: minicpmo_4_5_duplex_full_decode_local2_npu5.yaml
pipeline: minicpmo_4_5

duplex_session:
  # Preserve the native 1 s silence payload on the model timeline while
  # removing realtime wall-clock pacing between SPEAK generation units.
  native_silence_continuation_delay_ms: 0

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      code2wav_cache_initial_state: true
      code2wav_cross_prompt_batching: true
      code2wav_prewarm: true
      token2wav_cfg_mode: conditional
      token2wav_solver: euler
      token2wav_n_timesteps: 1
      token2wav_remove_hift_weight_norm: true
      talker_emit_codec_chunks: true
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 50
      codec_left_context_frames: 3
      talker_local_decode_stage_id: 1
      talker_local_decode_steps: 2
