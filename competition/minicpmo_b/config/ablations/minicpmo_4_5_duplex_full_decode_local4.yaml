# Native full-duplex competition profile for the local4 ablation.  This file
# exists only for same-contract A/B testing against local2.
base_config: minicpmo_4_5_full_decode_local4.yaml
pipeline: minicpmo_4_5
session_mode: duplex
active_stream_window: 1
duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  resume_replay_ttl_s: 60
  resume_replay_max_bytes_per_session: 8388608
  max_pending_input_bytes_per_session: 16777216
  max_pending_turns_per_session: 4
  max_sessions: 4
  completed_append_cache_size: 256

stages:
  - stage_id: 0
    async_scheduling: false

  - stage_id: 1
    async_scheduling: false

  - stage_id: 2
    async_scheduling: false
